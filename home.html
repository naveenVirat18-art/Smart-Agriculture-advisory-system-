<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Agriculture - Home</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #087b32, #35a853);
      color: #163b27;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      color: white;
      padding: 25px 10px;
    }

    .logo {
      width: 90px;
      height: 90px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 45px;
    }

    .header h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 16px;
    }

    .welcome {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,.15);
    }

    .welcome h2 {
      color: #087b32;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #555;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      min-height: 145px;
      padding: 20px 10px;
      text-align: center;
      text-decoration: none;
      color: #163b27;
      box-shadow: 0 8px 20px rgba(0,0,0,.15);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: transform .15s;
    }

    .card:active {
      transform: scale(.96);
    }

    .icon {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .card h3 {
      color: #087b32;
      font-size: 18px;
    }

    .footer {
      text-align: center;
      color: white;
      margin-top: 25px;
      padding-bottom: 20px;
      font-size: 13px;
    }

    @media (max-width: 360px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- HEADER -->
    <div class="header">

      <div class="logo">🌱</div>

      <h1>Smart Agriculture</h1>

      <p>Farmer Advisory System</p>

    </div>


    <!-- WELCOME -->
    <div class="welcome">

      <h2 id="welcomeName">
        Welcome Farmer
      </h2>

      <p>
        Select a service below
      </p>

    </div>


    <!-- 8 SERVICES -->
    <div class="grid">

      <!-- 1 CROP -->
      <a class="card" href="crop.html">

        <div class="icon">🌾</div>

        <h3>Crop Advisory</h3>

      </a>


      <!-- 2 SOIL -->
      <a class="card" href="soil.html">

        <div class="icon">🪨</div>

        <h3>Soil Advisory</h3>

      </a>


      <!-- 3 IRRIGATION -->
      <a class="card" href="irrigation.html">

        <div class="icon">💧</div>

        <h3>Irrigation</h3>

      </a>


      <!-- 4 FERTILIZER -->
      <a class="card" href="fertilizer.html">

        <div class="icon">🌱</div>

        <h3>Fertilizer</h3>

      </a>


      <!-- 5 WEATHER -->
      <a class="card" href="weather.html">

        <div class="icon">🌦️</div>

        <h3>Weather</h3>

      </a>


      <!-- 6 PEST -->
      <a class="card" href="pest.html">

        <div class="icon">🐛</div>

        <h3>Pest Advisory</h3>

      </a>


      <!-- 7 MANAGEMENT -->
      <a class="card" href="management.html">

        <div class="icon">📊</div>

        <h3>Farm Management</h3>

      </a>


      <!-- 8 MARKET -->
      <a class="card" href="market.html">

        <div class="icon">💰</div>

        <h3>Market Prices</h3>

      </a>

    </div>


    <div class="footer">
      Smart Agriculture © 2026
    </div>

  </div>


  <script>

    // Show farmer name if saved
    const farmerName =
      localStorage.getItem("farmerName");

    if (farmerName) {

      document.getElementById("welcomeName").textContent =
        "Welcome, " + farmerName;

    }

  </script>

</body>
</html>
