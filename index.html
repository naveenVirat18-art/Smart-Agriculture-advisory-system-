<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Agriculture Advisory System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Green agriculture ground background */
            background: linear-gradient(
                to bottom,
                #c8efa8 0%,
                #8bd267 40%,
                #55a844 70%,
                #2f7d32 100%
            );

            min-height: 100vh;
            color: #173b21;
        }

        .container {
            width: 92%;
            max-width: 450px;
            margin: 40px auto;
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
            color: white;
        }

        .logo .icon {
            font-size: 65px;
        }

        .logo h1 {
            margin: 8px 0;
            font-size: 28px;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
        }

        .logo p {
            margin: 0;
            font-size: 16px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .card {
            background: rgba(255,255,255,0.97);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.18);
        }

        .card h2 {
            text-align: center;
            margin-top: 0;
            color: #176b36;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #aaa;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border: 2px solid #176b36;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #176b36;
            color: white;
            font-size: 17px;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background: #12552b;
        }

        .switch {
            text-align: center;
            margin-top: 18px;
        }

        .switch a {
            color: #176b36;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            display: none;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            text-align: center;
        }

        .error {
            background: #ffe5e5;
            color: #a40000;
        }

        .success {
            background: #e1f5e5;
            color: #176b36;
        }

        #loginBox {
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 13px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
        }
    </style>
</head>

<body>

<div class="container">

    <!-- AGRICULTURE LOGO -->
    <div class="logo">

        <div class="icon">🌾</div>

        <h1>Smart Agriculture</h1>

        <p>
            Agriculture Advisory System
        </p>

    </div>


    <!-- REGISTER PAGE -->
    <div class="card" id="registerBox">

        <h2>📝 Farmer Registration</h2>

        <div
            id="registerMessage"
            class="message">
        </div>


        <div class="form-group">

            <label for="registerName">
                Farmer Name
            </label>

            <input
                type="text"
                id="registerName"
                placeholder="Enter your name"
                autocomplete="name"
            >

        </div>


        <div class="form-group">

            <label for="registerEmail">
                Email
            </label>

            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                autocomplete="email"
            >

        </div>


        <div class="form-group">

            <label for="registerPhone">
                Mobile Number
            </label>

            <input
                type="tel"
                id="registerPhone"
                placeholder="Enter mobile number"
                autocomplete="tel"
            >

        </div>


        <div class="form-group">

            <label for="registerPassword">
                Password
            </label>

            <input
                type="password"
                id="registerPassword"
                placeholder="Create password"
                autocomplete="new-password"
            >

        </div>


        <div class="form-group">

            <label for="registerConfirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="registerConfirmPassword"
                placeholder="Confirm password"
                autocomplete="new-password"
            >

        </div>


        <button onclick="registerUser()">
            Register
        </button>


        <div class="switch">

            Already have an account?

            <a onclick="showLogin()">
                Login
            </a>

        </div>

    </div>


    <!-- LOGIN PAGE -->
    <div class="card" id="loginBox">

        <h2>🔐 Farmer Login</h2>

        <div
            id="loginMessage"
            class="message">
        </div>


        <div class="form-group">

            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter registered email"
                autocomplete="email"
            >

        </div>


        <div class="form-group">

            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter password"
                autocomplete="current-password"
            >

        </div>


        <button onclick="loginUser()">
            Login
        </button>


        <div class="switch">

            Don't have an account?

            <a onclick="showRegister()">
                Register
            </a>

        </div>

    </div>


    <div class="footer">
        Smart Agriculture Advisory System
    </div>

</div>


<script>

    /* Check existing login */

    window.onload = function () {

        const loggedIn =
            localStorage.getItem("farmerLoggedIn");

        if (loggedIn === "true") {

            window.location.href =
                "home.html";
        }

    };


    /* Show Register */

    function showRegister() {

        document.getElementById(
            "registerBox"
        ).style.display = "block";

        document.getElementById(
            "loginBox"
        ).style.display = "none";

        clearMessages();
    }


    /* Show Login */

    function showLogin() {

        document.getElementById(
            "registerBox"
        ).style.display = "none";

        document.getElementById(
            "loginBox"
        ).style.display = "block";

        clearMessages();
    }


    /* Show message */

    function showMessage(
        elementId,
        message,
        type
    ) {

        const element =
            document.getElementById(elementId);

        element.textContent =
            message;

        element.className =
            "message " + type;

        element.style.display =
            "block";
    }


    /* Clear messages */

    function clearMessages() {

        document.getElementById(
            "registerMessage"
        ).style.display = "none";

        document.getElementById(
            "loginMessage"
        ).style.display = "none";
    }


    /* REGISTER USER */

    function registerUser() {

        const name =
            document.getElementById(
                "registerName"
            ).value.trim();

        const email =
            document.getElementById(
                "registerEmail"
            ).value.trim().toLowerCase();

        const phone =
            document.getElementById(
                "registerPhone"
            ).value.trim();

        const password =
            document.getElementById(
                "registerPassword"
            ).value;

        const confirmPassword =
            document.getElementById(
                "registerConfirmPassword"
            ).value;


        /* Empty field check */

        if (
            !name ||
            !email ||
            !phone ||
            !password ||
            !confirmPassword
        ) {

            showMessage(
                "registerMessage",
                "Please fill in all fields.",
                "error"
            );

            return;
        }


        /* Password length */

        if (password.length < 6) {

            showMessage(
                "registerMessage",
                "Password must contain at least 6 characters.",
                "error"
            );

            return;
        }


        /* Password match */

        if (password !== confirmPassword) {

            showMessage(
                "registerMessage",
                "Passwords do not match.",
                "error"
            );

            return;
        }


        /* Check existing user */

        const existingUser =
            localStorage.getItem("farmerUser");


        if (existingUser) {

            const user =
                JSON.parse(existingUser);

            if (user.email === email) {

                showMessage(
                    "registerMessage",
                    "This email is already registered. Please login.",
                    "error"
                );

                return;
            }
        }


        /* Create user */

        const user = {

            name: name,
            email: email,
            phone: phone,
            password: password

        };


        localStorage.setItem(
            "farmerUser",
            JSON.stringify(user)
        );


        showMessage(
            "registerMessage",
            "Registration successful! Please login.",
            "success"
        );


        /* Clear registration form */

        document.getElementById(
            "registerName"
        ).value = "";

        document.getElementById(
            "registerEmail"
        ).value = "";

        document.getElementById(
            "registerPhone"
        ).value = "";

        document.getElementById(
            "registerPassword"
        ).value = "";

        document.getElementById(
            "registerConfirmPassword"
        ).value = "";


        /* Open login */

        setTimeout(function () {

            showLogin();

        }, 1000);

    }


    /* LOGIN USER */

    function loginUser() {

        const email =
            document.getElementById(
                "loginEmail"
            ).value.trim().toLowerCase();

        const password =
            document.getElementById(
                "loginPassword"
            ).value;


        if (!email || !password) {

            showMessage(
                "loginMessage",
                "Please enter email and password.",
                "error"
            );

            return;
        }


        /* Get registered user */

        const savedUser =
            localStorage.getItem("farmerUser");


        if (!savedUser) {

            showMessage(
                "loginMessage",
                "No account found. Please register first.",
                "error"
            );

            return;
        }


        const user =
            JSON.parse(savedUser);


        /* Verify login */

        if (
            user.email === email &&
            user.password === password
        ) {

            localStorage.setItem(
                "farmerLoggedIn",
                "true"
            );

            localStorage.setItem(
                "farmerName",
                user.name
            );


            showMessage(
                "loginMessage",
                "Login successful! Opening app...",
                "success"
            );


            setTimeout(function () {

                window.location.href =
                    "home.html";

            }, 700);

        }

        else {

            showMessage(
                "loginMessage",
                "Incorrect email or password.",
                "error"
            );

        }

    }

</script>

</body>
</html>
