<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Smart Agriculture</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #087b32, #35a853);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #163b27;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.2);
    }

    .btn {
      width: 100%;
      border: none;
      background: #087b32;
      color: white;
      padding: 17px;
      border-radius: 12px;
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
